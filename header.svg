<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f260;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0575e6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f260;stop-opacity:1" />
    </linearGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes slideIn {
      0% { opacity: 0; transform: translateX(-50px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }
    .text-name {
      font-family: 'Segoe UI', sans-serif;
      font-weight: 800;
      font-size: 60px;
      fill: #fff;
      animation: slideIn 1.5s ease-out forwards;
    }
    .text-title {
      font-family: 'Courier New', monospace;
      font-weight: 600;
      font-size: 24px;
      fill: url(#glow);
      filter: url(#neon);
      animation: slideIn 1.5s ease-out 0.5s forwards, pulse 3s infinite;
      opacity: 0;
    }
    .container {
        fill: #0d0d0d;
    }
  </style>

  <rect width="100%" height="100%" class="container" />
  
  <text x="50" y="100" class="text-name">Seeipati Sithole</text>
  <text x="50" y="150" class="text-title">IT Technical Support Specialist</text>
</svg>
